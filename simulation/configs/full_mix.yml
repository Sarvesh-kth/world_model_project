# Test 1: the original collector's full mix (success, noisy scripted, drop, collide, random) on the fixed cube,
# random pick/place ends and 1-3 corridor obstacles, so the world model sees collisions, drops and random motion
# with their recorded reward components. Everything else comes from grade_e.yml / default.yml.
robot:
  posture_noise: 0.0
task:
  object:
    pool: [cube]
    randomize_color: false
  obstacles:
    count: [1, 3]
data:
  mix: {success: 0.4, scripted: 0.2, drop: 0.1, collide: 0.15, random: 0.15}
  success_attempts: 3
