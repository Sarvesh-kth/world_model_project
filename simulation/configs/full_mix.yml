# The full mix for the world model: cube and goal anywhere on the reachable table, 0-3 obstacles in between.
# success / scripted: clean and noisy picks; miss: a bad first close beside or above the cube; lateral: the
# close the way a planner does it (low, from the side); wander: random table points first, so the hand is
# seen far from the cube; drop / collide / random: the cube let go mid carry, a carry low through the
# obstacles, random motion. Everything else comes from default.yml.
task:
  pick_end: anywhere
  object:
    pool: [cube]
    randomize_color: false
  obstacles:
    count: [0, 3]
data:
  mix: {success: 0.2, scripted: 0.1, miss: 0.15, lateral: 0.15, wander: 0.25, drop: 0.05, collide: 0.05, random: 0.05}
  success_attempts: 3
